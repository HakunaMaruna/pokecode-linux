<!DOCTYPE html>
<html>
<head>
    <title>PokeCode</title>
    <style>
        body { margin: 0; background: #1e1e1e; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
    </style>
</head>
<body>
    <div style="display: flex; height: 100vh;">
        <!-- Левая колонка -->
        <div style="flex: 3; display: flex; flex-direction: column;">
            <div id="monaco-editor" style="flex: 2; border-bottom: 1px solid #444;"></div>
            <div id="terminal" style="flex: 1;"></div>
        </div>
        <!-- Правая колонка (Чат) -->
        <div style="flex: 1; border-left: 1px solid #444; display: flex; flex-direction: column; background: #252526;">
            <div id="chat-history" style="flex: 1; overflow-y: auto; padding: 10px; font-size: 12px;"></div>
            <input id="chat-input" type="text" placeholder="Запрос к OpenCode..." style="padding: 10px; border: none; background: #333; color: #fff;">
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
