<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PokeCode IDE</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; background:#1e1e1e; color:#ddd; }
  #layout { display:flex; height:100vh; }
  #sidebar { width:260px; background:#252526; border-right:1px solid #333; overflow:auto; padding:8px; }
  #main { flex:1; display:flex; flex-direction:column; }
  #toolbar { padding:8px; background:#2d2d2d; display:flex; gap:8px; align-items:center; }
  #editor { flex:1; }
  #output { height:180px; background:#111; color:#0f0; font-family:monospace; white-space:pre-wrap; overflow:auto; padding:8px; border-top:1px solid #333; }
  .file { padding:4px 6px; cursor:pointer; border-radius:4px; }
  .file:hover { background:#37373d; }
  button { background:#0e639c; color:#fff; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; }
  button:hover { background:#1177bb; }
  input { background:#3c3c3c; color:#ddd; border:1px solid #555; padding:6px; border-radius:4px; }
  h3 { margin:8px 0 4px; font-size:12px; text-transform:uppercase; color:#888; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <h3>Files</h3>
    <div id="files"></div>
    <h3>New file</h3>
    <input id="newpath" placeholder="path/to/file" />
    <button onclick="newFile()">Create</button>
  </div>
  <div id="main">
    <div id="toolbar">
      <span id="current">No file</span>
      <button onclick="saveFile()">Save</button>
      <input id="runcmd" placeholder="run command" style="flex:1" />
      <button onclick="runCmd()">Run</button>
    </div>
    <div id="editor"></div>
    <div id="output"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
let currentFile = null;
let editor = null;

require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
require(['vs/editor/editor.main'], function() {
  editor = monaco.editor.create(document.getElementById('editor'), {
    value: '',
    language: 'javascript',
    theme: 'vs-dark',
    automaticLayout: true
  });
});

async function loadFiles() {
  const res = await fetch('/api/files');
  const data = await res.json();
  const container = document.getElementById('files');
  container.innerHTML = '';
  data.files.forEach(f => {
    const div = document.createElement('div');
    div.className = 'file';
    div.textContent = f;
    div.onclick = () => openFile(f);
    container.appendChild(div);
  });
}

async function openFile(path) {
  const res = await fetch('/api/file?path=' + encodeURIComponent(path));
  const data = await res.json();
  if (data.error) { alert(data.error); return; }
  currentFile = path;
  document.getElementById('current').textContent = path;
  if (editor) {
    editor.setValue(data.content);
    const lang = path.split('.').pop();
    const map = {js:'javascript',ts:'typescript',py:'python',html:'html',css:'css',json:'json',md:'markdown',sh:'shell'};
    monaco.editor.setModelLanguage(editor.getModel(), map[lang] || 'plaintext');
  }
}

async function saveFile() {
  if (!currentFile) { alert('No file open'); return; }
  const content = editor ? editor.getValue() : '';
  await fetch('/api/save', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: currentFile, content})});
  alert('Saved');
}

async function newFile() {
  const p = document.getElementById('newpath').value.trim();
  if (!p) return;
  await fetch('/api/save', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({path: p, content: ''})});
  document.getElementById('newpath').value = '';
  loadFiles();
  openFile(p);
}

async function runCmd() {
  const cmd = document.getElementById('runcmd').value.trim() || (currentFile ? 'python3 ' + currentFile : '');
  const out = document.getElementById('output');
  out.textContent = 'Running...';
  const res = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({command: cmd})});
  const data = await res.json();
  out.textContent = (data.stdout || '') + (data.stderr ? '\n[stderr]\n' + data.stderr : '') + '\n[exit ' + data.code + ']';
}

loadFiles();
</script>
</body>
</html>
